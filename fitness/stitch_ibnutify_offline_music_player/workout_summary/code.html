<div class="w-8 h-8 rounded-full overflow-hidden active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<img alt="User profile picture" class="w-full h-full object-cover" data-alt="A highly detailed close-up portrait of a user profile avatar. A young athletic person silhouetted against a vibrant neon green and deep black cyberpunk-style background. High contrast, cinematic lighting, modern dark mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAzACE1I95DF4qhXSVEp2MXbwEIzJRcEMBUzcBA7Ml05AuI3u9hh4ZMWZ6ru8m_TgbO4pIOXkr9Il75OAC-3ZuGH9c1VROZi_U2gcPYPFojyc3uf0YFBIDC6PvzMC7w2RZOh2ye0104TP2O9hIf1GyswFf24COaRvm_MrJvF989wJb_MLpm966_fxrIM24lRgjfPZjmmem8z-RWkVtBw5BSkuq5F1t46AZ10JNlhfadyMFGCKU7dM1pcdbfHJuc1GiV538VPi6Yy4"/>

</div>
<span class="material-symbols-outlined text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">fitness_center</span>

<!-- Main Content Canvas -->
<main class="pt-24 px-margin pb-32 flex flex-col gap-lg max-w-2xl mx-auto">
<!-- Header Section -->
<section class="flex flex-col gap-base">
<h1 class="font-display-lg text-display-lg text-on-surface">Ringkasan Latihan</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="text-xl">🏃</span> Berlari • 24 Jul 2026, 07:30
            </p>
</section>
<!-- Map Section (Bento Grid Style) -->
<section class="relative w-full h-64 rounded-xl overflow-hidden shadow-2xl shadow-black/50 border border-surface-container-high">
<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A top-down view of a modern digital map displaying a running route. The map is styled in a sleek dark mode aesthetic with deep blacks and dark greys. A vibrant, glowing neon green line traces an intricate path through city streets. Subtle atmospheric bloom effects highlight the route, emphasizing a premium fitness tracking interface." data-location="Jakarta" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqZf_bzjEXh-GVJnaJDTNn0iDzdqnclJyMGByP0N1dSLHM8-5ZERilm_S34HD0pCG-YDPpk6TR8nV5r5o0E0R0D5r6cf22wxMkrMLLRqZ4TCvx28--rBmRqqP04tmo7R1QhV1OfmFVVnhb259xEn1qS3nCEQpO7B0e1CpMS7hJ4_KpJHPE-HjlYmaXaIrKguXfGGDoWEYwj3W0yii2arHD8m2LU7qXF16CfJuP67GX0I-5kUXL8CYlHM1ZmfEgKHJu0WFk9bohzsk')"></div>

<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 to-transparent pointer-events-none"></div>
<div class="absolute bottom-4 left-4 flex items-center gap-xs bg-surface-container-high/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-surface-variant">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="font-label-sm text-label-sm text-on-surface">Rute Selesai</span>
</div>
</section>
<!-- Stats Grid (Bento) -->
<section class="grid grid-cols-2 gap-sm">
<!-- Stat: Total Distance -->
<div class="bg-surface-container-low p-md rounded-xl flex flex-col gap-xs justify-center items-start border border-surface-container-highest">
<span class="material-symbols-outlined text-on-surface-variant">route</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-primary">5.25 KM</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Jarak Total</span>
</div>
</div>
<!-- Stat: Total Time -->
<div class="bg-surface-container-low p-md rounded-xl flex flex-col gap-xs justify-center items-start border border-surface-container-highest">
<span class="material-symbols-outlined text-on-surface-variant">timer</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">00:32:15</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Waktu Total</span>
</div>
</div>
<!-- Stat: Average Pace -->
<div class="bg-surface-container-low p-md rounded-xl flex flex-col gap-xs justify-center items-start border border-surface-container-highest">
<span class="material-symbols-outlined text-on-surface-variant">speed</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">06'08"/km</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Pace Rata-rata</span>
</div>
</div>
<!-- Stat: Songs Played -->
<div class="bg-surface-container-low p-md rounded-xl flex flex-col gap-xs justify-center items-start border border-surface-container-highest">
<span class="material-symbols-outlined text-primary">library_music</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">8 Lagu</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Dimainkan</span>
</div>
</div>
</section>
<!-- Notes Section -->
<section class="flex flex-col gap-xs">
<label class="font-title-sm text-title-sm text-on-surface" for="workout-notes">Catatan Latihan (Opsional)</label>
<textarea class="w-full bg-surface-container border border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="workout-notes" placeholder="Bagaimana latihanmu hari ini?" rows="3"></textarea>
</section>

<div class="fixed bottom-0 w-full bg-gradient-to-t from-background via-background/95 to-transparent pt-xl pb-margin px-margin z-40">

                Buang
            </button>
