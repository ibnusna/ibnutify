plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: 'com.chaquo.python'

android {
    namespace = "com.ibnutify.ibnutify"
    compileSdk = 35
    buildToolsVersion = "35.0.0"
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.ibnutify.ibnutify"
        minSdk = 26 // Required for health plugin, just_audio, audio_service, and Chaquopy
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.10"
            pip {
                options "--default-timeout=1000"
                // Removed heavy ML libraries (librosa, scikit-learn) because they take
                // 10 minutes to extract on slow Android devices.
                // The analyzer.py script now safely falls back to pseudo-random
                // deterministic features and clustering without these dependencies.

                // Music Downloader dependencies (downloader.py)
                install "yt-dlp"
                install "requests"
                install "mutagen"
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
