<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Recap - GARA</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            overflow: hidden; /* Mencegah scroll saat story aktif */
            color: white;
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }

        /* Animation Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { 
            0% { transform: scale(0.5); opacity: 0; } 
            70% { transform: scale(1.05); } 
            100% { transform: scale(1); opacity: 1; } 
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-15px); } 
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes typing {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* Utility Classes */
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-pop { animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        /* Dynamic Backgrounds */
        .bg-gradient-animate {
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
        }

        /* Noise Texture Overlay (The "Premium" Feel) */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Background Decor Shapes */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: 0;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            gap: 4px;
            padding: 12px 0;
            position: absolute;
            top: 0;
            left: 16px;
            right: 16px;
            z-index: 50;
        }
        .progress-bg {
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            flex: 1;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            box-shadow: 0 0 10px rgba(255,255,255,0.7);
        }

        /* Typing Dots Animation */
        .typing-dots::after {
            content: '';
            animation: typing 1.5s infinite;
            display: inline-block;
            width: 1em;
            text-align: left;
        }

        /* Text Shadow for better contrast */
        .text-shadow {
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
        <!-- Background Elements for Loader -->
        <div class="absolute inset-0 bg-gradient-to-tr from-indigo-900/40 to-black pointer-events-none"></div>
        <div class="blob bg-purple-600 w-64 h-64 top-1/4 -left-10 opacity-20 animate-float"></div>
        <div class="blob bg-blue-600 w-64 h-64 bottom-1/4 -right-10 opacity-20 animate-float" style="animation-delay: -2s;"></div>

        <div class="relative z-10 flex flex-col items-center">
            <div class="relative w-28 h-28 mb-8">
                <!-- Outer Ring -->
                <div class="absolute inset-0 border-4 border-t-purple-500 border-r-transparent border-b-purple-500 border-l-transparent rounded-full animate-spin"></div>
                <!-- Inner Ring -->
                <div class="absolute inset-4 border-4 border-t-transparent border-r-pink-500 border-b-transparent border-l-pink-500 rounded-full animate-spin reverse-spin" style="animation-direction: reverse; animation-duration: 2s;"></div>
                <!-- Icon -->
                <i class="fa-solid fa-bolt absolute inset-0 flex items-center justify-center text-4xl text-yellow-400 animate-pulse"></i>
            </div>
            
            <h2 class="text-2xl font-black text-white mb-3 tracking-widest uppercase">GARA RECAP</h2>
            <p class="text-white/70 text-base font-medium animate-pulse">
                Hal keren akan muncul sebentar lagi<span class="typing-dots"></span>
            </p>
        </div>
    </div>

    <!-- 2. MAIN APP CONTAINER -->
    <div id="app-container" class="fixed inset-0 hidden flex items-center justify-center bg-gray-900">
        
        <!-- Desktop Blur Background (Dynamic) -->
        <div id="blur-bg" class="absolute inset-0 bg-cover bg-center opacity-40 blur-3xl transition-all duration-1000 transform scale-110"></div>

        <!-- Mobile Viewport (The Story) -->
        <div id="story-viewport" class="relative w-full max-w-md h-full max-h-[900px] bg-black shadow-2xl overflow-hidden md:rounded-3xl border border-white/10">
            
            <!-- Global Noise Overlay -->
            <div class="noise-overlay"></div>

            <!-- Progress Bars -->
            <div id="progress-wrapper" class="progress-container"></div>

            <!-- Close Button -->
            <button onclick="closeRecap()" class="absolute top-8 right-6 z-50 text-white/50 hover:text-white p-2 transition-colors">
                <i class="fa-solid fa-xmark text-2xl drop-shadow-md"></i>
            </button>

            <!-- Navigation Touch Areas -->
            <div id="touch-left" class="absolute top-0 left-0 w-1/3 h-full z-40"></div>
            <div id="touch-right" class="absolute top-0 right-0 w-1/3 h-full z-40"></div>
            <div id="touch-hold" class="absolute top-0 left-1/3 w-1/3 h-full z-40"></div>

            <!-- DYNAMIC SLIDE CONTENT -->
            <div id="slide-content" class="w-full h-full relative z-20">
                <!-- Content injected by JS -->
            </div>

            <!-- Background Decor Layer (Changed per slide) -->
            <div id="slide-decor" class="absolute inset-0 z-10 transition-opacity duration-700">
                <!-- Decor injected by JS -->
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. MOCK DATA
        // ==========================================
        const userData = {
            student_name: "Raka",
            period: "Triwulan I 2026",
            stats: {
                total_days: 14,
                streak: 5,
                total_hours: 6,
                total_minutes: 42,
                top_feature: "Ruang Belajar",
                feature_percentage: 70,
                exams_count: 6,
                assignments_count: 12,
                avg_score_trend: "up",
                best_day_date: "17 Januari",
                best_day_count: 8
            },
            persona: {
                type: "The Deadline Ninja",
                desc: "Tenang, tapi mematikan di detik-detik terakhir. Tugas mepet deadline selalu jadi masterpiecemu.",
                icon: "fa-user-ninja"
            },
            color_palettes: [
                "bg-gradient-to-br from-violet-950 via-purple-900 to-fuchsia-900", // Slide 0: Opening (Deep Purple)
                "bg-gradient-to-b from-slate-900 via-teal-900 to-emerald-900",     // Slide 1: Presence (Teal Dark)
                "bg-gradient-to-tr from-red-950 via-orange-900 to-amber-900",       // Slide 2: Streak (Fire)
                "bg-gradient-to-bl from-blue-950 via-indigo-900 to-cyan-900",       // Slide 3: Time (Deep Sea)
                "bg-gradient-to-br from-fuchsia-950 via-pink-900 to-rose-900",      // Slide 4: Preference (Vibrant)
                "bg-gradient-to-t from-gray-900 via-gray-800 to-yellow-900",        // Slide 5: Persona (Gold/Dark)
                "bg-gradient-to-tl from-rose-950 via-red-900 to-pink-900",          // Slide 6: Action (Red)
                "bg-gradient-to-br from-indigo-950 via-blue-900 to-violet-900",     // Slide 7: Trend (Blue)
                "bg-gradient-to-tr from-emerald-950 via-green-900 to-lime-900",     // Slide 8: Highlight (Green)
                "bg-gradient-to-b from-gray-950 via-zinc-900 to-black"              // Slide 9: Closing
            ]
        };

        // ==========================================
        // 2. DECOR & SLIDES
        // ==========================================
        
        // Helper untuk background shapes biar "Gak Polos"
        const getDecor = (index) => {
            const decors = [
                // 0. Opening
                `<div class="blob bg-pink-500 w-80 h-80 top-0 left-0 opacity-20 animate-float"></div>
                 <div class="blob bg-purple-500 w-64 h-64 bottom-0 right-0 opacity-20 animate-float" style="animation-delay: -3s;"></div>`,
                
                // 1. Presence
                `<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle, white 1px, transparent 1px); background-size: 30px 30px;"></div>
                 <div class="blob bg-teal-500 w-96 h-96 -top-20 -right-20 opacity-20 blur-3xl"></div>`,
                
                // 2. Streak (Particles)
                `<div class="absolute inset-0 overflow-hidden">
                    ${Array(5).fill(0).map((_, i) => 
                        `<div class="absolute rounded-full bg-orange-500 blur-xl opacity-20 animate-float" 
                             style="width: ${Math.random()*100+50}px; height: ${Math.random()*100+50}px; 
                             left: ${Math.random()*100}%; top: ${Math.random()*100}%; 
                             animation-duration: ${Math.random()*5+3}s;"></div>`
                    ).join('')}
                 </div>`,

                // 3. Time Spent
                `<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] border border-white/5 rounded-full animate-spin-slow"></div>
                 <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] border border-white/10 rounded-full animate-spin-slow" style="animation-direction: reverse;"></div>`,
                
                // 4. Preference
                `<div class="blob bg-fuchsia-600 w-full h-64 bottom-0 opacity-30 blur-[80px]"></div>`,

                // 5. Persona
                `<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                 <div class="blob bg-yellow-500 w-64 h-64 top-1/4 left-1/2 -translate-x-1/2 opacity-20"></div>`,

                // 6. Action
                 `<div class="absolute -left-20 top-20 w-40 h-96 bg-rose-500 opacity-20 rotate-45 blur-3xl"></div>`,

                // 7. Trend
                `<div class="absolute inset-0 opacity-10" style="background-image: linear-gradient(0deg, transparent 24%, white 25%, white 26%, transparent 27%, transparent 74%, white 75%, white 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, white 25%, white 26%, transparent 27%, transparent 74%, white 75%, white 76%, transparent 77%, transparent); background-size: 50px 50px;"></div>`,

                // 8. Highlight
                `<div class="blob bg-emerald-400 w-96 h-96 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-10 animate-pulse"></div>`,

                // 9. Closing
                `<div class="blob bg-white w-64 h-64 top-0 right-0 opacity-10"></div>
                 <div class="blob bg-purple-500 w-64 h-64 bottom-0 left-0 opacity-10"></div>`
            ];
            return decors[index % decors.length];
        };

        const slides = [
            // 0. Opening
            {
                render: (data) => `
                    <div class="flex flex-col justify-center h-full p-8 text-center relative z-20">
                        <h3 class="text-xl font-bold mb-4 animate-slide-up delay-100 opacity-80 tracking-wide text-shadow">Halo, ${data.student_name}!</h3>
                        <h1 class="text-6xl font-extrabold mb-6 leading-tight animate-slide-up delay-200 text-shadow">
                            Ini bulan<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300 drop-shadow-sm">belajar kamu.</span>
                        </h1>
                        <p class="text-lg animate-slide-up delay-300 leading-relaxed opacity-90">Enggak terasa 3 bulan berlalu. Penasaran sejauh mana jejakmu di GARA?</p>
                        <div class="mt-16 animate-pop delay-500">
                             <div class="inline-block p-4 rounded-full border border-white/20 bg-white/5 backdrop-blur-md">
                                <i class="fa-solid fa-chevron-right text-2xl opacity-80 animate-pulse"></i>
                             </div>
                             <p class="text-xs mt-4 opacity-50 uppercase tracking-widest">Tap untuk mulai</p>
                        </div>
                    </div>
                `
            },
            // 1. Presence
            {
                render: (data) => `
                    <div class="flex flex-col justify-center h-full p-8 relative z-20">
                        <div class="text-7xl mb-6 animate-pop filter drop-shadow-lg">🗓️</div>
                        <h2 class="text-4xl font-extrabold mb-4 animate-slide-up delay-100 text-shadow">Kamu hadir menemani kami selama <span class="text-teal-300 underline decoration-teal-500/30 underline-offset-4">${data.stats.total_days} hari</span>.</h2>
                        <p class="text-xl opacity-90 animate-slide-up delay-200 font-medium">Terima kasih sudah menyempatkan waktu untuk masa depanmu.</p>
                        
                        <!-- Visual Kalender Abstrak -->
                        <div class="grid grid-cols-7 gap-3 mt-12 animate-slide-up delay-300 opacity-80">
                            ${Array(28).fill(0).map((_, i) => `<div class="w-full pt-[100%] rounded-lg transition-all duration-500 hover:scale-110 ${Math.random() > 0.6 ? 'bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)]' : 'bg-white/10 border border-white/5'}"></div>`).join('')}
                        </div>
                    </div>
                `
            },
            // 2. Streak
            {
                render: (data) => `
                    <div class="flex flex-col items-center justify-center h-full p-8 text-center relative z-20">
                        <div class="relative mb-10">
                            <div class="absolute inset-0 bg-orange-500 blur-[60px] opacity-40 animate-pulse"></div>
                            <i class="fa-solid fa-fire text-9xl text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-red-600 animate-pop delay-100 drop-shadow-sm"></i>
                        </div>
                        <h2 class="text-4xl font-bold mb-2 animate-slide-up delay-200 text-shadow">Konsistensi Membara!</h2>
                        <p class="text-lg mb-8 animate-slide-up delay-300 opacity-80">Rekor tanpa putus:</p>
                        <div class="relative">
                            <span class="text-[10rem] font-black text-white leading-none animate-pop delay-500 drop-shadow-[0_10px_30px_rgba(255,100,0,0.5)]">
                                ${data.stats.streak}
                            </span>
                        </div>
                        <p class="text-2xl font-bold mt-4 animate-slide-up delay-700 tracking-[0.5em] text-orange-200">HARI</p>
                    </div>
                `
            },
            // 3. Time Spent
            {
                render: (data) => `
                    <div class="flex flex-col justify-end h-full p-8 pb-24 relative z-20">
                         <div class="absolute top-24 right-8 animate-float opacity-80">
                            <i class="fa-solid fa-clock text-8xl text-blue-200/20 backdrop-blur-sm"></i>
                        </div>
                        <h2 class="text-3xl font-bold mb-8 animate-slide-up delay-100 text-shadow">Total Nongkrong:</h2>
                        
                        <div class="space-y-2">
                            <div class="flex items-baseline animate-slide-up delay-200">
                                <span class="text-8xl font-black text-sky-300 mr-3 drop-shadow-lg">${data.stats.total_hours}</span>
                                <span class="text-3xl font-bold text-white/80">Jam</span>
                            </div>
                            <div class="flex items-baseline animate-slide-up delay-300">
                                <span class="text-8xl font-black text-sky-300 mr-3 drop-shadow-lg">${data.stats.total_minutes}</span>
                                <span class="text-3xl font-bold text-white/80">Menit</span>
                            </div>
                        </div>

                        <div class="mt-8 glass-card p-5 rounded-2xl animate-slide-up delay-500 flex items-center space-x-4 transform hover:scale-105 transition-transform">
                            <div class="bg-white/20 p-3 rounded-full">
                                <i class="fa-solid fa-film text-xl"></i>
                            </div>
                            <p class="text-base font-medium">Itu setara dengan nonton 3 film Avengers berturut-turut! 🎬</p>
                        </div>
                    </div>
                `
            },
            // 4. Preference
            {
                render: (data) => `
                    <div class="flex flex-col justify-center h-full p-8 relative z-20">
                        <h2 class="text-4xl font-bold mb-10 animate-slide-up text-shadow leading-tight">Rumah keduamu adalah...</h2>
                        
                        <div class="glass-card p-8 rounded-3xl border border-white/30 animate-pop delay-200 text-center shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-fuchsia-400 to-purple-600"></div>
                            <i class="fa-solid fa-book-open text-6xl text-fuchsia-300 mb-6 drop-shadow-lg"></i>
                            <h1 class="text-4xl font-extrabold mb-4 tracking-tight">${data.stats.top_feature}</h1>
                            
                            <div class="w-full bg-gray-800/50 h-4 rounded-full mt-6 overflow-hidden border border-white/10">
                                <div class="bg-gradient-to-r from-fuchsia-500 to-purple-500 h-full rounded-full relative" style="width: ${data.stats.feature_percentage}%">
                                     <div class="absolute right-0 top-0 bottom-0 w-1 bg-white/50"></div>
                                </div>
                            </div>
                            <p class="mt-4 text-base font-semibold text-fuchsia-100">${data.stats.feature_percentage}% waktumu habis disini.</p>
                        </div>
                        
                        <p class="mt-12 text-2xl text-center font-bold animate-slide-up delay-500 italic text-white/90">"Anak niat banget nih."</p>
                    </div>
                `
            },
            // 5. Persona (The Reveal)
            {
                render: (data) => `
                    <div class="flex flex-col items-center justify-center h-full p-6 text-center relative z-20">
                        <p class="uppercase tracking-[0.3em] text-sm mb-6 animate-slide-up text-yellow-200/80 font-bold">Learning Persona</p>
                        
                        <!-- Card Container -->
                        <div class="relative w-full aspect-[3/4] max-h-[550px] animate-pop delay-200 perspective-1000">
                            <!-- Card Content -->
                            <div class="absolute inset-0 bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.5)] p-1 flex flex-col transform transition-transform hover:scale-[1.02]">
                                <div class="w-full h-full border-4 border-yellow-200/50 rounded-[1.8rem] flex flex-col items-center justify-between p-6 relative overflow-hidden">
                                    
                                    <!-- Noise on card -->
                                    <div class="absolute inset-0 bg-black/5 noise-overlay"></div>
                                    
                                    <div class="mt-8 relative z-10">
                                        <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm mb-4 shadow-inner">
                                            <i class="fa-solid ${data.persona.icon} text-5xl text-white drop-shadow-md"></i>
                                        </div>
                                    </div>
                                    
                                    <div class="relative z-10 w-full">
                                        <h2 class="text-3xl font-black text-white uppercase transform -rotate-1 mb-4 drop-shadow-lg leading-none">${data.persona.type}</h2>
                                        <div class="glass-card bg-black/20 p-5 rounded-xl text-left backdrop-blur-md border-none">
                                            <p class="text-white font-semibold text-sm leading-relaxed">
                                                "${data.persona.desc}"
                                            </p>
                                        </div>
                                    </div>
                                    
                                    <div class="w-full flex justify-between items-end text-[10px] font-mono text-white/60 relative z-10 mt-4 uppercase">
                                        <span>GARA // 2026</span>
                                        <span>#RARE</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            // 6. Academic Action
            {
                render: (data) => `
                    <div class="flex flex-col justify-center h-full p-8 relative z-20">
                        <h2 class="text-4xl font-bold mb-12 animate-slide-up text-shadow leading-tight">Lu berani,<br>gak ngilang.</h2>
                        
                        <div class="space-y-8">
                            <div class="flex items-center space-x-6 animate-slide-up delay-200 group">
                                <div class="w-20 h-20 bg-gradient-to-br from-rose-400 to-rose-600 rounded-2xl flex items-center justify-center text-3xl font-bold shadow-lg shadow-rose-500/40 transform group-hover:scale-110 transition-transform">
                                    ${data.stats.exams_count}
                                </div>
                                <div class="flex-1">
                                    <div class="text-2xl font-bold text-white mb-1">Ujian Selesai</div>
                                    <div class="h-1 w-full bg-white/10 rounded-full"><div class="h-full bg-rose-500 w-3/4"></div></div>
                                </div>
                            </div>
                            
                            <div class="flex items-center space-x-6 animate-slide-up delay-300 group">
                                <div class="w-20 h-20 bg-gradient-to-br from-pink-400 to-pink-600 rounded-2xl flex items-center justify-center text-3xl font-bold shadow-lg shadow-pink-500/40 transform group-hover:scale-110 transition-transform">
                                    ${data.stats.assignments_count}
                                </div>
                                <div class="flex-1">
                                    <div class="text-2xl font-bold text-white mb-1">Tugas Disubmit</div>
                                    <div class="h-1 w-full bg-white/10 rounded-full"><div class="h-full bg-pink-500 w-full"></div></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-16 p-6 glass-card rounded-xl animate-slide-up delay-500 text-center border-l-4 border-white">
                            <p class="italic text-lg font-medium">"Setiap tugas selesai adalah satu langkah lebih dekat ke impian."</p>
                        </div>
                    </div>
                `
            },
            // 7. Trend
            {
                render: (data) => {
                    let trendText = data.stats.avg_score_trend === 'up' ? "Nilaimu menanjak naik! 🚀" : "Stabil terus, pertahankan!";
                    let trendColor = data.stats.avg_score_trend === 'up' ? "text-emerald-300" : "text-blue-300";
                    return `
                    <div class="flex flex-col justify-center h-full p-8 relative z-20">
                        <h2 class="text-2xl font-bold mb-2 animate-slide-up opacity-80">Progress Check</h2>
                        <h3 class="text-4xl ${trendColor} font-black mb-12 animate-slide-up delay-100 drop-shadow-lg leading-tight">${trendText}</h3>
                        
                        <div class="relative h-72 w-full animate-slide-up delay-300">
                             <!-- Grid Background for Chart -->
                             <div class="absolute inset-0 border-l border-b border-white/20" style="background-image: linear-gradient(0deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 100% 25%;"></div>
                            
                            <svg class="absolute inset-0 w-full h-full overflow-visible" preserveAspectRatio="none">
                                <defs>
                                    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
                                        <stop offset="0%" stop-color="rgba(255,255,255,0.5)" />
                                        <stop offset="100%" stop-color="${data.stats.avg_score_trend === 'up' ? '#6ee7b7' : '#93c5fd'}" />
                                    </linearGradient>
                                </defs>
                                <path d="M0,220 C80,200 150,150 200,100 S280,50 340,10" 
                                      fill="none" stroke="url(#lineGradient)" stroke-width="6" stroke-linecap="round" 
                                      class="drop-shadow-[0_4px_10px_rgba(0,0,0,0.5)]"
                                      stroke-dasharray="600" stroke-dashoffset="600"
                                      style="animation: drawLine 2s ease forwards 0.5s;">
                                </path>
                                <style>@keyframes drawLine { to { stroke-dashoffset: 0; } }</style>
                                
                                <circle cx="0" cy="220" r="8" fill="white" />
                                <circle cx="340" cy="10" r="10" fill="${data.stats.avg_score_trend === 'up' ? '#34d399' : '#60a5fa'}" class="animate-pop delay-1000 stroke-4 stroke-white/50" />
                            </svg>
                        </div>
                        <div class="flex justify-between mt-6 text-sm font-bold opacity-60 animate-fade-in delay-1000 uppercase tracking-widest">
                            <span>Start</span>
                            <span>Now</span>
                        </div>
                    </div>
                `},
            },
            // 8. Highlight
            {
                render: (data) => `
                    <div class="flex flex-col items-center justify-center h-full p-8 text-center relative z-20 overflow-hidden">
                        <!-- Sunburst Effect -->
                         <div class="absolute inset-0 flex items-center justify-center opacity-30 animate-spin-slow" style="animation-duration: 40s;">
                            <div class="w-[200%] h-24 bg-gradient-to-r from-transparent via-white/10 to-transparent absolute rotate-0"></div>
                            <div class="w-[200%] h-24 bg-gradient-to-r from-transparent via-white/10 to-transparent absolute rotate-45"></div>
                            <div class="w-[200%] h-24 bg-gradient-to-r from-transparent via-white/10 to-transparent absolute rotate-90"></div>
                            <div class="w-[200%] h-24 bg-gradient-to-r from-transparent via-white/10 to-transparent absolute rotate-[135deg]"></div>
                        </div>

                        <p class="text-xl mb-8 relative z-10 animate-slide-up font-bold tracking-widest uppercase opacity-80">Ingat tanggal ini?</p>
                        
                        <div class="glass-card bg-white/95 text-emerald-900 p-10 rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.4)] relative z-10 transform -rotate-3 animate-pop delay-200 border-4 border-emerald-500/20">
                            <h1 class="text-6xl font-black mb-3 leading-none tracking-tight">${data.stats.best_day_date}</h1>
                            <div class="h-2 bg-emerald-900/10 w-full mb-4 rounded-full"></div>
                            <p class="font-bold text-xl uppercase tracking-wider text-emerald-800">Hari Paling Produktif</p>
                        </div>

                        <p class="mt-12 text-2xl relative z-10 animate-slide-up delay-500 font-medium leading-relaxed">
                            Kamu menyelesaikan <br><span class="font-black text-4xl text-emerald-300 drop-shadow-md">${data.stats.best_day_count} aktivitas</span><br> sekaligus. Superb!
                        </p>
                    </div>
                `
            },
            // 9. Closing & Share
            {
                render: (data) => `
                    <div class="flex flex-col items-center justify-center h-full p-8 text-center relative z-20">
                        <h2 class="text-4xl font-black mb-6 animate-slide-up leading-tight">Triwulan ini seru banget berkat kamu.</h2>
                        
                        <div class="glass-card w-full p-6 rounded-3xl mb-10 animate-slide-up delay-200 text-left border-l-8 border-l-purple-500 shadow-2xl">
                            <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                                <h3 class="font-black text-2xl tracking-widest">GARA RECAP</h3>
                                <span class="text-[10px] bg-white text-black font-bold px-2 py-1 rounded uppercase">${data.period}</span>
                            </div>
                            <ul class="space-y-4 text-base text-gray-200">
                                <li class="flex items-center"><span class="w-8 text-center mr-2">👤</span> <span class="text-white font-bold text-lg">${data.persona.type}</span></li>
                                <li class="flex items-center"><span class="w-8 text-center mr-2">🔥</span> <span class="text-white font-bold text-lg">${data.stats.streak} Hari Streak</span></li>
                                <li class="flex items-center"><span class="w-8 text-center mr-2">⏳</span> <span class="text-white font-bold text-lg">${data.stats.total_hours} Jam Belajar</span></li>
                            </ul>
                            <div class="mt-6 text-center text-xs opacity-50 font-mono">gara-lms.com/user/${data.student_name}</div>
                        </div>

                        <button class="w-full py-4 bg-white text-black font-bold text-lg rounded-full mb-4 shadow-[0_10px_20px_rgba(255,255,255,0.2)] hover:scale-105 transition-transform animate-slide-up delay-500 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-share-nodes"></i> Bagikan Ceritamu
                        </button>
                        
                        <button onclick="closeRecap()" class="text-sm opacity-60 hover:opacity-100 hover:text-white underline animate-fade-in delay-700 font-semibold transition-colors">
                            Kembali ke Dashboard
                        </button>
                    </div>
                `
            }
        ];

        // ==========================================
        // 3. ENGINE & LOGIC
        // ==========================================

        let currentSlide = 0;
        let isPaused = false;
        let slideDuration = 6000;
        let progressInterval;
        let startTime;
        let remainingTime = slideDuration;

        const appContainer = document.getElementById('app-container');
        const loadingScreen = document.getElementById('loading-screen');
        const storyViewport = document.getElementById('story-viewport');
        const slideContent = document.getElementById('slide-content');
        const slideDecor = document.getElementById('slide-decor');
        const progressWrapper = document.getElementById('progress-wrapper');
        const blurBg = document.getElementById('blur-bg');

        // --- Initialization ---

        window.addEventListener('load', () => {
            // Simulasi load asset & data (3.5 detik)
            // Di production, ganti ini dengan Promise.all([fetchData(), loadImages()])
            
            setTimeout(() => {
                // Auto Start Transition
                loadingScreen.classList.add('opacity-0', 'pointer-events-none'); // Fade out loader
                
                setTimeout(() => {
                   loadingScreen.style.display = 'none';
                   appContainer.classList.remove('hidden');
                   // Sedikit delay biar transisi background smooth
                   setTimeout(() => {
                        startStory();
                   }, 100);
                }, 1000); // Tunggu fade out selesai

            }, 3500); 
        });

        function startStory() {
            initProgressBars();
            showSlide(0);
        }

        // --- Render Logic ---

        function initProgressBars() {
            progressWrapper.innerHTML = '';
            slides.forEach((_, idx) => {
                const barContainer = document.createElement('div');
                barContainer.className = 'progress-bg';
                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                fill.id = `progress-${idx}`;
                barContainer.appendChild(fill);
                progressWrapper.appendChild(barContainer);
            });
        }

        function showSlide(index) {
            if (index < 0 || index >= slides.length) {
                if(index >= slides.length) closeRecap();
                return;
            }

            currentSlide = index;
            
            // 1. Update Background Color (Viewport)
            const bgClass = userData.color_palettes[index % userData.color_palettes.length];
            // Reset classes first then add new ones to avoid conflict
            storyViewport.className = `relative w-full max-w-md h-full max-h-[900px] shadow-2xl overflow-hidden md:rounded-3xl border border-white/10 transition-colors duration-1000 ease-in-out ${bgClass} bg-gradient-animate`;
            
            // 2. Update Desktop Background (Matches slide color roughly)
            // Just triggers a CSS transition on the blur div
            // In a real app, you might parse the color hex. Here we rely on opacity blending.
            
            // 3. Inject Content
            slideContent.innerHTML = slides[index].render(userData);

            // 4. Inject Decor (Shapes/Particles)
            slideDecor.innerHTML = getDecor(index);

            // 5. Progress Bars
            resetProgressBars(index);
            startProgressBar(index);
        }

        function resetProgressBars(currentIndex) {
            slides.forEach((_, idx) => {
                const bar = document.getElementById(`progress-${idx}`);
                if (idx < currentIndex) {
                    bar.style.width = '100%';
                    bar.style.transition = 'none';
                } else {
                    bar.style.width = '0%';
                    bar.style.transition = 'none';
                }
            });
        }

        function startProgressBar(index) {
            clearInterval(progressInterval);
            startTime = Date.now();
            remainingTime = slideDuration;
            isPaused = false;

            const bar = document.getElementById(`progress-${index}`);
            
            progressInterval = setInterval(() => {
                if (!isPaused) {
                    const elapsed = Date.now() - startTime;
                    const percent = Math.min((elapsed / slideDuration) * 100, 100);
                    bar.style.width = `${percent}%`;

                    if (elapsed >= slideDuration) {
                        clearInterval(progressInterval);
                        nextSlide();
                    }
                } else {
                    startTime = Date.now() - ((parseFloat(bar.style.width) / 100) * slideDuration);
                }
            }, 16);
        }

        // --- Interaction Logic ---

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { if(currentSlide > 0) showSlide(currentSlide - 1); else showSlide(0); }

        function closeRecap() {
            clearInterval(progressInterval);
            appContainer.classList.add('opacity-0');
            setTimeout(() => {
                appContainer.classList.add('hidden');
                appContainer.classList.remove('opacity-0');
                // Logic redirect atau refresh
                alert("Closing Recap...");
            }, 500);
        }

        // Touch Listeners
        const touchLeft = document.getElementById('touch-left');
        const touchRight = document.getElementById('touch-right');
        const touchHold = document.getElementById('touch-hold');

        touchRight.addEventListener('click', nextSlide);
        touchLeft.addEventListener('click', prevSlide);

        // Hold Logic
        [touchLeft, touchRight, touchHold].forEach(area => {
            ['mousedown', 'touchstart'].forEach(evt => {
                area.addEventListener(evt, () => { 
                    isPaused = true; 
                    slideContent.classList.add('scale-[0.98]', 'transition-transform'); 
                });
            });
            ['mouseup', 'touchend', 'mouseleave'].forEach(evt => {
                area.addEventListener(evt, () => { 
                    isPaused = false; 
                    slideContent.classList.remove('scale-[0.98]'); 
                });
            });
        });

        // Keyboard Nav
        document.addEventListener('keydown', (e) => {
            if (appContainer.classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === ' ') isPaused = true;
        });
        document.addEventListener('keyup', (e) => { if (e.key === ' ') isPaused = false; });

    </script>
</body>
