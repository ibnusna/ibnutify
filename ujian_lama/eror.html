<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Lost - Ruang Ujian</title>

    <!-- MENGHUBUNGKAN DESIGN SYSTEM UTAMA (Sesuai Instruksi) -->
    <link rel="stylesheet" href="assets/root.css">

    <style>
        /* ========================================
           PAGE SPECIFIC STYLING (Mac Native Look)
           ========================================
        */

        body {
            /* Menggunakan variabel dari root.css */
            background-color: var(--color-bg-body);
            color: var(--color-text-main);
            font-family: var(--font-family-base);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Mencegah scroll */
        }

        /* Container utama menyerupai Window macOS */
        .mac-window {
            background-color: var(--color-surface);
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius-xl);
            /* Shadow tebal untuk kedalaman seperti aplikasi desktop */
            box-shadow: var(--shadow-xl), 0 0 0 1px var(--color-border);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 0;
            opacity: 0;
            transform: scale(0.95);
            animation: windowIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Title Bar a la macOS */
        .window-header {
            height: 44px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            padding: 0 var(--space-4);
            background: linear-gradient(to bottom, #ffffff, #f9fafb);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        /* Traffic Lights (Merah, Kuning, Hijau) */
        .traffic-lights {
            display: flex;
            gap: 8px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .light.red {
            background-color: #ff5f56;
            border: 1px solid #e0443e;
        }

        .light.yellow {
            background-color: #ffbd2e;
            border: 1px solid #dea123;
        }

        .light.green {
            background-color: #27c93f;
            border: 1px solid #1aab29;
        }

        /* Area Konten */
        .window-content {
            padding: var(--space-8) var(--space-6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* SVG Container */
        .illustration-box {
            width: 120px;
            height: 120px;
            margin-bottom: var(--space-6);
            position: relative;
            /* Flex center untuk SVG */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Typography Override untuk Error Page */
        .error-title {
            font-size: var(--text-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-main);
            margin-bottom: var(--space-2);
        }

        .error-desc {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            line-height: 1.5;
            margin-bottom: var(--space-8);
            max-width: 280px;
        }

        /* Tombol Native Style */
        .action-btn {
            background: var(--color-primary);
            color: var(--color-surface);
            font-size: var(--text-sm);
            font-weight: var(--font-weight-medium);
            padding: 10px 24px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            /* Untuk border-focus */
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .action-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn:disabled {
            background-color: var(--color-text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* Animasi SVG (Hanya saat proses/loading) */
        .spin-anim {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes windowIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Shake animation untuk feedback error */
        .shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
</head>

<body>

    <!-- Mac Window Container -->
    <main class="mac-window" id="main-window">
        <!-- Header (Aesthetic Only) -->
        <header class="window-header">
            <div class="traffic-lights">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
        </header>

        <!-- Content -->
        <div class="window-content">

            <!-- Custom SVG: Disconnected Cloud System -->
            <div class="illustration-box">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Base Circle (Background) -->
                    <circle cx="50" cy="50" r="45" fill="var(--color-primary-light)" opacity="0.5" />

                    <!-- Cloud Shape -->
                    <path
                        d="M68 60H32C28.6863 60 26 57.3137 26 54C26 50.966 28.2536 48.4608 31.1818 48.0583C31.5422 44.0952 34.869 41 38.9 41C39.6925 41 40.4573 41.1209 41.1787 41.3469C42.668 37.3168 46.5273 34.5 51 34.5C56.636 34.5 61.3557 38.2612 62.6468 43.435C65.6565 44.4554 68 47.1996 68 50.5C68 50.8522 67.9768 51.1979 67.9319 51.5361"
                        stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- Cross Line (Menandakan Error) -->
                    <line x1="30" y1="30" x2="70" y2="70" stroke="var(--color-accent-text)" stroke-width="4"
                        stroke-linecap="round" />

                    <!-- Disconnected Signal/Pulse (Static visual, animated on logic) -->
                    <path d="M75 30C79 34 81 39 81 45" stroke="var(--color-text-muted)" stroke-width="2"
                        stroke-linecap="round" stroke-opacity="0.5" />
                    <path d="M80 25C86 31 89 38 89 45" stroke="var(--color-text-muted)" stroke-width="2"
                        stroke-linecap="round" stroke-opacity="0.3" />
                </svg>
            </div>

            <h1 class="error-title">Koneksi Terputus</h1>
            <p class="error-desc">
                Tidak dapat terhubung ke server Ruang Ujian. Periksa koneksi internet Anda lalu coba muat ulang.
            </p>

            <button id="reloadBtn" class="action-btn">
                <!-- Ikon Refresh SVG -->
                <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                <span id="btnText">Muat Ulang Halaman</span>
            </button>

        </div>
    </main>

    <!-- Custom Logic Recovery -->
    <script src="js/error.js"></script>
</body>

</html>
