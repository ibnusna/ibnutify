<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Ujian</title>

  <!-- Favicon -->
  <link rel="icon" href="img\GARA_ICON.svg" type="image/png">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Design System & Page Styles -->
  <link rel="stylesheet" href="assets/root.css">
  <link rel="stylesheet" href="assets/header.css">
  <link rel="stylesheet" href="assets/login.css">

  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>

  <div class="login-layout">

    <!-- Header -->
    <header class="app-header">
      <div class="header-container">
        <img src="img\FARA_BLACK (1).svg" alt="Logo Kemendikbud" class="brand-logo">
        <div class="brand-divider">
          <h1 class="brand-title">
            RUANG UJIAN<br>GARUDA AKADEMI
          </h1>
        </div>

        <!-- Logout / Home Button -->
        <a href="http://garudakademi.ct.ws/" class="header-logout-btn btn-kembali-beranda"
          title="Kembali ke Halaman Utama">
          <i class="fas fa-sign-out-alt"></i>
        </a>
      </div>
    </header>

    <!-- Main Content (Split Layout) -->
    <main class="main-content">
      <!-- Background Decor -->
      <div class="bg-decor">
        <div class="bg-pattern"></div>
      </div>

      <div class="content-wrapper">

        <!-- Kiri: Informasi Sekolah & Mapel (Desktop Only) -->
        <aside class="info-panel">
          <h2 class="school-name">Garuda Akademi</h2>
          <p class="app-subtitle">Platform Ujian Sekolah Terintegrasi</p>

          <div class="info-cards-container">
            <!-- Info Mapel -->
            <div class="subject-card">
              <div class="subject-icon-wrapper">
                <i class="fas fa-flask"></i>
              </div>
              <div>
                <h3 class="subject-title">IPA & Informatika</h3>
                <p class="subject-desc">Evaluasi pemahaman konsep sains dan teknologi informasi.</p>
              </div>
            </div>

            <!-- Info Guru -->
            <div class="teacher-profile">
              <div class="teacher-avatar">
                <i class="fas fa-chalkboard-teacher"></i>
              </div>
              <div>
                <p class="teacher-label">Guru Pengampu</p>
                <h3 class="teacher-name">Ibnu Sina Sudrajat</h3>
              </div>
            </div>
          </div>
        </aside>

        <!-- Kanan: Form Login -->
        <section class="login-panel">
          <div class="login-card">
            <!-- Hiasan atas card -->
            <div class="card-decor-line"></div>

            <div class="login-header">
              <h3 class="login-title">Login Peserta</h3>
              <p class="login-subtitle">Selamat datang di Ruang Ujian</p>
            </div>

            <!-- FORM WRAPPER -->
            <div class="login-form">

              <!-- Input NIS -->
              <div class="form-group">
                <label class="form-label">Nomor Induk Siswa (NIS)</label>
                <div class="input-wrapper">
                  <span class="input-icon">
                    <i class="fas fa-id-card"></i>
                  </span>
                  <input type="number" id="nisInput" class="form-input" placeholder="Masukkan NIS kamu" required>
                </div>
              </div>

              <!-- Input Kode Akses -->
              <div class="form-group">
                <label class="form-label">Kode Akses Ujian</label>
                <div class="input-wrapper">
                  <span class="input-icon">
                    <i class="fas fa-key"></i>
                  </span>
                  <input type="number" id="kodeAksesInput" class="form-input" placeholder="Masukkan Kode Akses"
                    required>
                </div>
              </div>

              <!-- Tombol Masuk -->
              <button id="submitBtn" class="btn-primary">
                <span>MASUK SEKARANG</span>
                <i class="fas fa-arrow-right-to-bracket"></i>
              </button>

            </div>

            <div class="login-footer">
              <p class="footer-text">
                Garuda Akademi<br>
                Dibuat Oleh Ibnu Sina Sudrajat
              </p>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- File JavaScript Logika Asli -->
  <script src="js/app.js"></script>
  <script src="js/google-apps.js"></script>
  <script src="js/auth.js"></script>

  <!-- Network Monitor (Global Offline Detection) -->
  <script src="js/network-monitor.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const returnUrl = sessionStorage.getItem('exam_return_url');
      if (returnUrl) {
        document.querySelectorAll('.header-logout-btn').forEach(btn => {
          btn.href = returnUrl;
        });
      }
    });
  </script>
</body>
</html>
